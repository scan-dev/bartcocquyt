languageCode: en-us
baseURL: "https://bartcocquyt.com/"
title: Bart Cocquyt
theme: "PaperMod"

enablerobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false

params:
  # env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: BartCocquyt
  description: "A born **IT Professional and Tech Enthusiast** always eager to get my hands dirty on all new developments in the **IT and Technology World**"
  keywords: [Blog, Portfolio, Tech Professional]
  author: Bart Cocquyt
  # author: ["Me", "You"] # multiple authors 
  defaultTheme: dark
   
  ShowShareButtons: true

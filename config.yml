    Content: A born **IT Professional and Tech Enthusiast** always eager to get my hands dirty on all new developments in the **IT and Technology World**"
      
    socialIcons:
      - name: "facebook"
        url: "https://facebook.com/Bart-Cocquyt"
      - name: "linkedin"
        url: "https://linkedin.com/in/bart-cocquyt"
      - name: "github"
        url: "https://github.com/scan-dev"    


  ShowReadingTime: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  social: true

  socialIcons:
      - name: "facebook"
        url: "https://facebook.com/Bart-Cocquyt"
      - name: "linkedin"
        url: "https://linkedin.com/in/bart-cocquyt"
      - name: "github"
        url: "https://github.com/scan-dev"
  

  label:
    text: "Bart Cocquyt"
